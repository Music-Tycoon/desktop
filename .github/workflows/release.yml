# Instaladores de la app de escritorio (Tauri v2) para Windows y macOS.
#
#   git tag v0.1.0 && git push origin v0.1.0   → compila y publica la release con los instaladores
#   Actions → «release» → Run workflow         → solo compila y deja los artefactos en el run
#
# La build necesita los repos hermanos «app» y «engine» como carpetas vecinas (musicopoly-app y
# musicopoly-engine): se clonan con el secreto ORG_REPO_PAT (token con lectura a los repos de la org).
# Los instaladores llevan el servidor online incrustado (MUSICOPOLY_SERVER): app.musictycoon.online.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  MUSICOPOLY_SERVER: https://app.musictycoon.online

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (Intel: añadir macos-13 con su propio instalador)
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop

      - uses: actions/checkout@v4
        with:
          repository: Music-Tycoon/app
          token: ${{ secrets.ORG_REPO_PAT }}
          path: musicopoly-app

      - uses: actions/checkout@v4
        with:
          repository: Music-Tycoon/engine
          token: ${{ secrets.ORG_REPO_PAT }}
          path: musicopoly-engine

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias
        run: |
          npm ci --prefix musicopoly-app
          npm ci --prefix desktop

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (web + tauri)
        working-directory: desktop
        run: npm run build

      - name: Instaladores
        uses: actions/upload-artifact@v4
        with:
          name: MusicTycoon-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar en la release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
